name: Daily News Bot

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Тест: выпуск уходит в личку, канал и состояние не трогаются'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY:     ${{ secrets.NEWS_API_KEY }}
          MY_CHAT_ID:       ${{ secrets.MY_CHAT_ID }}
          TEST_MODE:        ${{ inputs.test_mode }}
        run: python news_bot.py

      - name: Commit state
        run: |
          git config user.email "bot@github.com"
          git config user.name "News Bot"
          git add sent_urls.txt last_run.txt log.txt
          git commit -m "state $(date +%Y-%m-%d-%H%M)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || (git pull --rebase origin main && git push)
